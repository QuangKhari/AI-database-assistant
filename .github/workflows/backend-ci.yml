name: Backend CI

# Chay CI cho moi push/PR huong vao develop hoac main, va cho moi PR vao
# 2 nhanh nay tu bat ky feature/dev branch nao - dung yeu cau checklist:
# "100% Pass Unit Test tren Local/CI truoc khi Merge PR".
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Neu push nhieu lan lien tiep vao cung 1 PR, huy sớm run CI cu de tiet
# kiem thoi gian/tai nguyen runner.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    # Test dung H2 in-memory (xem pom.xml / application-test.properties neu
    # co) nen KHONG can service MySQL that cho hau het test. Neu du an co
    # test integration can MySQL that, mo comment phan "services" ben duoi.
    # services:
    #   mysql:
    #     image: mysql:8.0
    #     env:
    #       MYSQL_ROOT_PASSWORD: root
    #       MYSQL_DATABASE: ai_db_assistant_test
    #     ports:
    #       - 3306:3306
    #     options: >-
    #       --health-cmd="mysqladmin ping -h localhost"
    #       --health-interval=10s
    #       --health-timeout=5s
    #       --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # File src/test/resources/application.properties da tu cung cap day
      # du gia tri test (H2, JWT secret fake, Gemini key fake...) nen KHONG
      # can truyen bien moi truong o day. Cac test AI (LLMClientTest,
      # NL2SQLEngineTest...) deu mock RestTemplate/LLMClient, khong goi
      # Gemini that.
      - name: Run tests
        run: ./mvnw clean verify -B

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload build artifact (jar)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # Job rieng de build thu Docker image, dam bao Dockerfile luon build
  # duoc thanh cong tren moi PR (khop muc P1 "CI build Docker image" trong
  # checklist Dockerize & Deployment). KHONG push image len registry o day
  # - chi build de phat hien som Dockerfile bi hong.
  docker-build-check:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-db-assistant-backend:ci