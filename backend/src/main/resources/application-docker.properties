# =====================================================================
# Profile "docker" - active khi container chay voi
# SPRING_PROFILES_ACTIVE=docker (xem docker-compose.yml).
# =====================================================================

spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:ai_db_assistant_system}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

logging.level.com.example.aidatabaseassistant=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}