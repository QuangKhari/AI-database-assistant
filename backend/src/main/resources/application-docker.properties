# =====================================================================
# Profile "docker" - active khi container chay voi
# SPRING_PROFILES_ACTIVE=docker (xem docker-compose.yml).
# =====================================================================

spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:ai_db_assistant_system}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

jwt.expiration=28800000

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
gemini.embedding.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
gemini.api.key=${GEMINI_API_KEY}

app.encryption.secret=${ENCRYPTION_SECRET}

management.health.redis.enabled=false

# Mail health indicator (Actuator) thu ket noi SMTP that moi lan
# /actuator/health duoc goi - neu MAIL_USERNAME/PASSWORD chua duoc cau
# hinh hoac container khong ra duoc internet (port 587), indicator nay
# se DOWN va lam ca healthcheck cua container bi "unhealthy" du backend
# van chay binh thuong. Tat giong het ly do tat Redis health o tren -
# gui email that (neu co) van hoat dong binh thuong, chi la khong tinh
# vao ket qua healthcheck.
management.health.mail.enabled=false

app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

logging.level.com.example.aidatabaseassistant=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email (SMTP) - xem chi tiet trong application.properties.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# PHAI trung voi domain frontend that su khi deploy (vd https://aidbassistant.site).
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5174}

# Trong container, nen mount 1 volume vao day de du lieu Excel khong mat
# khi container bi recreate (xem lai docker-compose.yml khi lam Docker).
app.storage.excel-dir=${EXCEL_STORAGE_DIR:/app/data/excel-dbs}

# =========================
# Cache - Redis (neu app.cache.provider=redis)
# =========================
# Trong docker-compose, service Redis ten la "redis" (khong phai
# "localhost") - container backend goi sang container redis qua ten
# service tren cung 1 network. Xem docker-compose.yml (profile "redis").
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}