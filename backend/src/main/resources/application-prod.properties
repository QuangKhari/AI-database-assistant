server.forward-headers-strategy=framework

spring.datasource.url=${SYSTEM_DB_URL}
spring.datasource.username=${SYSTEM_DB_USERNAME}
spring.datasource.password=${SYSTEM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

app.frontend.base-url=${FRONTEND_BASE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.target-db.allow-private-hosts=${ALLOW_PRIVATE_TARGET_HOSTS:false}

app.query.default-timeout-seconds=${QUERY_DEFAULT_TIMEOUT_SECONDS:20}
app.query.max-timeout-seconds=${QUERY_MAX_TIMEOUT_SECONDS:30}
app.query.max-rows=${QUERY_MAX_ROWS:500}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
