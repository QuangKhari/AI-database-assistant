spring.application.name=aidatabaseassistant-test

# H2 in-memory DB rieng cho test, khong dung MySQL/Docker that
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=TestOnlySecretKeyForJUnitDoNotUseInProduction123456
jwt.expiration=3600000

app.encryption.secret=TestSecret16Byte

gemini.api.key=test-fake-key
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

gemini.embedding.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
gemini.embedding.model=gemini-embedding-001

# =========================
# Cache - TAT trong test (xem giai thich chi tiet trong CacheConfig.java)
# =========================
# Cache Caffeine la singleton bean, KHONG duoc rollback theo transaction
# cua tung @Test nhu du lieu H2 -> neu de bat, ID bi tai su dung giua
# cac test (cung Spring context) co the khien 1 test doc phai schema
# "cache" tu 1 test khac, gay flaky test rat kho debug. Tat hoan toan
# la lua chon an toan nhat cho bo test hien tai.
app.cache.provider=none