services:

  # ============================================================
  # MYSQL
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: ai-db-assistant-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ai_db_assistant_system}

    ports:
      # HOST:CONTAINER
      # MySQL Docker:
      # localhost:3308 -> mysql:3306
      - "${MYSQL_HOST_BIND:-127.0.0.1}:3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/init-sample-db:/docker-entrypoint-initdb.d:ro

    networks:
      - ai-db-assistant-net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g


  # ============================================================
  # REDIS - OPTIONAL
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ai-db-assistant-redis
    restart: unless-stopped

    profiles:
      - redis

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD phải được set trong .env khi bật profile redis}

    # BUG FIX (bảo mật):
    #
    # Truoc day: "6379:6379" publish Redis ra TAT CA interface cua host
    # (0.0.0.0), khong khac gi mysql neu KHONG co "127.0.0.1:" o dau. Redis
    # ALSO khong he duoc bat requirepass o day - REDIS_PASSWORD chi duoc
    # truyen cho container BACKEND (de no biet dung password nao khi ket
    # noi), con chinh Redis server thi KHONG doi hoi AUTH gi ca. Ket qua:
    # neu deploy len 1 VPS/server co IP public va bat profile "redis" ma
    # khong co firewall chan port 6379, BAT KY AI tren Internet co the
    # ket noi thang vao Redis KHONG CAN mat khau - day la 1 trong nhung
    # loi cau hinh bi khai thac nhieu nhat trong thuc te (ghi cron job/
    # SSH key de RCE, ransomware xoa sach du lieu Redis...).
    #
    # Fix: (1) bat buoc REDIS_PASSWORD phai duoc set qua ":?" o tren -
    # docker compose se BAO LOI ngay khi khoi dong neu .env quen dien,
    # thay vi am tham chay khong mat khau; (2) truyen --requirepass thuc
    # su cho tien trinh redis-server; (3) bind port ve 127.0.0.1 mac dinh
    # giong het cach mysql dang lam, chi mo ra ngoai khi that su can (vi
    # du debug tu may khac) qua REDIS_HOST_BIND.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - ai-db-assistant-net

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m


  # ============================================================
  # BACKEND - SPRING BOOT
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-db-assistant-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_NAME: ${DB_NAME:-ai_db_assistant_system}
      SECURITY_SSRF_ALLOWED_HOSTS: ${SECURITY_SSRF_ALLOWED_HOSTS:-mysql}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5174}

      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      CACHE_PROVIDER: ${CACHE_PROVIDER:-caffeine}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xmx512m}

    ports:
      # ========================================================
      # QUAN TRỌNG:
      #
      # HOST 8081 -> CONTAINER 8080
      #
      # Backend IntelliJ:
      # localhost:8080
      #
      # Backend Docker:
      # localhost:8081
      # ========================================================
      - "8081:8080"

    volumes:
      - excel_data:/app/data/excel-dbs

    networks:
      - ai-db-assistant-net

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ============================================================
  # FRONTEND - REACT + NGINX
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai-db-assistant-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      # HOST 5173 -> NGINX CONTAINER 80
      - "5174:80"

    networks:
      - ai-db-assistant-net


# ==============================================================
# NETWORK
# ==============================================================
networks:
  ai-db-assistant-net:
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  mysql_data:
  redis_data:
  excel_data: